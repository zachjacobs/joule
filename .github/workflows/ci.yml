name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: sw_vers && swift --version
      - name: Build
        run: BUILD="$GITHUB_RUN_NUMBER" Joule/build.sh
      - name: Test
        run: Joule/Joule.app/Contents/MacOS/Joule --selftest
      - name: Check the bundle
        run: |
          codesign --verify --strict --verbose=2 Joule/Joule.app
          plutil -lint Joule/Joule.app/Contents/Info.plist
          test -s Joule/Joule.app/Contents/Resources/Joule.icns
          ditto -c -k --keepParent Joule/Joule.app Joule.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Joule
          path: Joule.zip
          retention-days: 14
